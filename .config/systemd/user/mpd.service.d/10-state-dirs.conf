# MPD will not start without its state directories, and does not create them:
# it exits 1 with "Failed to open ... No such file or directory". Ubuntu's
# packaged unit declares no StateDirectory=, so systemd creates nothing either.
#
# The directories cannot simply live beside mpd.conf, because ~/.config/mpd is
# a stow symlink INTO the dotfiles repo -- a database, a log and a state file
# written there would land in git.
#
# So the fix travels with the config rather than sitting in the installer.
# MPD is deliberately NOT in the fleet package list (students get Amberol, which
# needs no daemon), so putting a mkdir in the build would have created empty
# directories on every student laptop for a service none of them run. Here it
# costs nothing: a drop-in for a service that is not installed is simply never
# used.
#
# Verified by deleting the directories: mpd fails to start without this, and
# starts cleanly with it.

[Service]
ExecStartPre=/bin/mkdir -p %h/.local/state/mpd %h/.local/share/mpd/playlists
