# MPD — Music Player Daemon
#
# WHY THE PATHS LOOK SPLIT
#
# This file lives in the dotfiles repo and is stowed to ~/.config/mpd, so
# ~/.config/mpd is a SYMLINK INTO ~/.dotfiles. Anything MPD writes next to this
# file therefore lands inside the git repo — a binary database, a growing log
# and a state file, all showing up as untracked churn on every commit.
#
# So: configuration here, everything mutable under ~/.local/state/mpd, which is
# a real directory and not stowed. Playlists are user data worth keeping, so
# they go to ~/.local/share/mpd.
#
# Why this service was failing before: with no ~/.config/mpd/mpd.conf, mpd fell
# through to /etc/mpd.conf, which is root-only, and died with
# "Failed to open /etc/mpd.conf: Permission denied" on every start.
#
# SETTING THIS UP ON A NEW MACHINE
#
# MPD is not in the fleet package list -- students get Amberol, which needs no
# daemon -- so this config arrives via stow but nothing installs mpd itself.
# Where you DO want it:
#
#   sudo apt install mpd mpc
#   mkdir -p ~/.config/systemd/user/mpd.service.d
#   ln -s ../../../../.dotfiles/.config/systemd/user/mpd.service.d/10-state-dirs.conf \
#         ~/.config/systemd/user/mpd.service.d/10-state-dirs.conf
#   systemctl --user daemon-reload && systemctl --user enable --now mpd
#
# That mkdir is NOT optional and cannot be left to stow. Because
# ~/.config/systemd/user already exists, stow folds and creates mpd.service.d
# as a DIRECTORY SYMLINK -- and systemd silently ignores symlinked drop-in
# directories. Verified 31 Aug 2026: with the directory symlinked, DropInPaths
# is empty after daemon-reload and mpd fails exactly as if the drop-in were not
# there. It must be a real directory with the .conf symlinked inside it.

music_directory     "~/Music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/state/mpd/database"
log_file            "~/.local/state/mpd/log"
state_file          "~/.local/state/mpd/state"
sticker_file        "~/.local/state/mpd/sticker.sql"

# No pid_file: the unit runs `mpd --systemd` in the foreground, and systemd
# tracks the process itself.

# Localhost only. Nothing outside this machine has any business talking to it,
# and rmpc, mpc and mpd-mpris all connect locally.
bind_to_address     "127.0.0.1"
port                "6600"

# ytmusic drops new files straight into ~/Music, so pick them up without
# needing an explicit `mpc update`. Depth 3 covers artist/album/track.
auto_update         "yes"
auto_update_depth   "3"

# PipeWire is what this build runs (pipewire-pulse + wireplumber); the plugin
# is compiled into Ubuntu's mpd.
audio_output {
    type    "pipewire"
    name    "PipeWire"
}
