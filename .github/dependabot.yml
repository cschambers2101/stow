# Package updates arrive as pull requests into beta. Remove any ecosystem whose manifest this repository does not have,
# or Dependabot reports an error for it.
# Every block waits a week (cooldown) before it proposes a new version: a hijacked release is usually found and
# pulled within days. Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: beta
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: beta
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
