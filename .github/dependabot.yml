# cc-local-development: package updates arrive as pull requests into beta and go through the full process.
# adopt-repo.sh writes the blocks for the repository's LANGUAGES (the "# pack:" lines mark them); take out any
# ecosystem whose manifest this repository does not have, or Dependabot reports an error for it.
# Every block waits a week (cooldown) before it proposes a new version: a hijacked release is usually found and
# pulled within days, before it reaches a first build on the developer's machine (accepted limit 21). Security
# updates are not delayed.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: beta
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: beta
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
